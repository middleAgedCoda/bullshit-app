<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bullshit™ — Analyzing…</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="background:#14140F;color:#EDE7D9;font-family:monospace;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <p>Routing to Bullshit™…</p>
  <script>
    // Android share sheet lands here with ?title=&text=&url=
    const params = new URLSearchParams(window.location.search);
    const payload = params.get('url') || params.get('text') || params.get('title') || '';
    // Forward straight into the main app, which reads ?input= on load and auto-runs analysis
    window.location.replace('/index.html?input=' + encodeURIComponent(payload) + '&auto=1');
  </script>
</body>
</html>
